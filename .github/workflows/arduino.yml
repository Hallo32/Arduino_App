name: Arduino build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: Compile for ESP32-C6
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Compile Blinky
        run: |
          arduino-cli compile \
            --export-binaries \
            --output-dir build/esp32c6 \
            --fqbn esp32:esp32:esp32c6:PartitionScheme=no_fs \
            blinky

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: blinky-esp32c6-firmware
          path: build/esp32c6/

  release:
    name: Create GitHub release
    if: github.event_name == 'push'
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: blinky-esp32c6-firmware
          path: release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_ID}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --generate-notes